<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #fff;
      --line: #d8dee6;
      --text: #1c2430;
      --muted: #667085;
      --accent: #1a6f4c;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Sans", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    header {
      background: #16382c;
      color: #fff;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    header h1 { margin: 0; font-size: 17px; font-weight: 600; }
    header span { font-size: 12px; opacity: .8; }
    main { padding: 14px 18px 84px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px 12px;
    }
    label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    input {
      width: 100%;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      font-size: 13px;
    }
    .table-wrap {
      max-height: 420px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      position: sticky; top: 0;
      background: #eef3f0;
      font-size: 11px;
      color: var(--muted);
      text-align: left;
      padding: 7px 6px;
      border-bottom: 1px solid var(--line);
    }
    td { padding: 4px 5px; border-bottom: 1px solid #eef1f4; }
    td.no { width: 28px; color: var(--muted); text-align: center; }
    td.num { width: 78px; }
    td.major { width: 22%; }
    td.mid { width: 28%; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 14px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button:disabled { opacity: .5; cursor: wait; }
    footer.bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: #fff;
      border-top: 1px solid var(--line);
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #status { color: var(--muted); font-size: 13px; }
    #status.err { color: var(--danger); }

    .combo { position: relative; }
    .combo input { padding-right: 22px; }
    .combo-list {
      display: none;
      position: absolute;
      left: 0; right: 0;
      top: 100%;
      z-index: 20;
      max-height: 180px;
      overflow: auto;
      margin: 0;
      padding: 4px 0;
      list-style: none;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(16, 24, 40, .12);
    }
    .combo.open .combo-list { display: block; }
    .combo-list li {
      padding: 6px 10px;
      cursor: pointer;
    }
    .combo-list li:hover,
    .combo-list li.active { background: #e7f4ee; }
    .combo-list li.new { color: var(--accent); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>車検 請求入力</h1>
    <span>30行を直接編集 → 印刷用シートへ出力</span>
  </header>
  <main>
    <section class="card">
      <h2>ヘッダー</h2>
      <div class="grid">
        <div><label>K-No</label><input id="kNo" placeholder="0120"></div>
        <div><label>登録番号</label><input id="plate"></div>
        <div><label>担当</label><input id="staff"></div>
        <div><label>入庫日</label><input id="inDate"></div>
        <div><label>完成日</label><input id="doneDate"></div>
        <div><label>請求日</label><input id="billDate"></div>
      </div>
    </section>
    <section class="card">
      <h2>明細（30行）　大項目・中項目は入力すると候補が絞られます。リストに無い文言もそのまま使えます。</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>大項目</th>
              <th>中項目・作業内容</th>
              <th>技術料</th>
              <th>部品</th>
              <th>数量</th>
              <th>単価</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer class="bar">
    <div id="status">読み込み中…</div>
    <button type="button" id="btnPrint">印刷用シートを作成</button>
  </footer>

  <script>
    var master = { majors: [], allMids: [], midsByMajor: {}, linesPerPage: 30 };
    var items = [];
    var openCombo = null;

    function $(id) { return document.getElementById(id); }

    function setStatus(msg, isErr) {
      var el = $('status');
      el.textContent = msg;
      el.className = isErr ? 'err' : '';
    }

    function emptyRow() {
      return { major: '', name: '', fee: '', part: '', qty: '', unitPrice: '' };
    }

    function midsFor(major) {
      if (!major) return master.allMids || [];
      return (master.midsByMajor && master.midsByMajor[major]) || [];
    }

    function remember(major, mid) {
      if (major && master.majors.indexOf(major) === -1) master.majors.push(major);
      if (!mid) return;
      if (master.allMids.indexOf(mid) === -1) master.allMids.push(mid);
      if (major) {
        if (!master.midsByMajor[major]) master.midsByMajor[major] = [];
        if (master.midsByMajor[major].indexOf(mid) === -1) master.midsByMajor[major].push(mid);
      }
    }

    function filterList(all, q) {
      q = String(q || '').toLowerCase();
      if (!q) return all.slice(0, 80);
      return all.filter(function (v) {
        return String(v).toLowerCase().indexOf(q) !== -1;
      }).slice(0, 80);
    }

    function closeCombos() {
      document.querySelectorAll('.combo.open').forEach(function (el) {
        el.classList.remove('open');
      });
      openCombo = null;
    }

    function renderComboList(combo, options, query) {
      var ul = combo.querySelector('.combo-list');
      var filtered = filterList(options, query);
      ul.innerHTML = '';
      filtered.forEach(function (v, idx) {
        var li = document.createElement('li');
        li.textContent = v;
        if (idx === 0) li.className = 'active';
        li.addEventListener('mousedown', function (e) {
          e.preventDefault();
          pickCombo(combo, v);
        });
        ul.appendChild(li);
      });
      var typed = String(query || '').trim();
      if (typed && options.indexOf(typed) === -1) {
        var add = document.createElement('li');
        add.className = 'new';
        add.textContent = '「' + typed + '」をそのまま使う';
        add.addEventListener('mousedown', function (e) {
          e.preventDefault();
          pickCombo(combo, typed);
        });
        ul.appendChild(add);
      }
      combo.classList.add('open');
      openCombo = combo;
    }

    function pickCombo(combo, value) {
      var input = combo.querySelector('input');
      input.value = value;
      var i = Number(combo.dataset.i);
      var k = combo.dataset.k;
      items[i][k] = value;
      combo.classList.remove('open');
      if (k === 'major') remember(value, '');
      if (k === 'name') {
        remember(items[i].major, value);
        fillFeeIfKnown(i);
      }
    }

    function fillFeeIfKnown(i) {
      var it = items[i];
      if (!it.name) return;
      if (it.fee !== '' && it.fee != null) return;
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res) return;
          if ((it.fee === '' || it.fee == null) && res.midFee !== '' && res.midFee != null) {
            it.fee = res.midFee;
            var feeInput = document.querySelector('input[data-i="' + i + '"][data-k="fee"]');
            if (feeInput) feeInput.value = res.midFee;
          }
        })
        .expandMidSelection(it.major || '', it.name);
    }

    function bindCombo(combo, getOptions) {
      var input = combo.querySelector('input');
      input.addEventListener('focus', function () {
        renderComboList(combo, getOptions(), input.value);
      });
      input.addEventListener('input', function () {
        var i = Number(combo.dataset.i);
        items[i][combo.dataset.k] = input.value;
        renderComboList(combo, getOptions(), input.value);
      });
      input.addEventListener('keydown', function (e) {
        var lis = combo.querySelectorAll('.combo-list li');
        var cur = combo.querySelector('.combo-list li.active');
        var idx = Array.prototype.indexOf.call(lis, cur);
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (lis[idx + 1]) {
            if (cur) cur.classList.remove('active');
            lis[idx + 1].classList.add('active');
            lis[idx + 1].scrollIntoView({ block: 'nearest' });
          }
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (lis[idx - 1]) {
            if (cur) cur.classList.remove('active');
            lis[idx - 1].classList.add('active');
            lis[idx - 1].scrollIntoView({ block: 'nearest' });
          }
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (cur) pickCombo(combo, cur.classList.contains('new') ? input.value.trim() : cur.textContent);
          else pickCombo(combo, input.value.trim());
        } else if (e.key === 'Escape') {
          combo.classList.remove('open');
        }
      });
      input.addEventListener('blur', function () {
        setTimeout(function () { combo.classList.remove('open'); }, 120);
      });
    }

    function renderGrid() {
      var n = master.linesPerPage || 30;
      items = [];
      var tb = $('tbody');
      tb.innerHTML = '';
      for (var i = 0; i < n; i++) {
        items.push(emptyRow());
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="no">' + (i + 1) + '</td>' +
          '<td class="major"><div class="combo" data-i="' + i + '" data-k="major">' +
            '<input data-i="' + i + '" data-k="major" autocomplete="off">' +
            '<ul class="combo-list"></ul></div></td>' +
          '<td class="mid"><div class="combo" data-i="' + i + '" data-k="name">' +
            '<input data-i="' + i + '" data-k="name" autocomplete="off">' +
            '<ul class="combo-list"></ul></div></td>' +
          '<td class="num"><input data-i="' + i + '" data-k="fee"></td>' +
          '<td><input data-i="' + i + '" data-k="part"></td>' +
          '<td class="num"><input data-i="' + i + '" data-k="qty"></td>' +
          '<td class="num"><input data-i="' + i + '" data-k="unitPrice"></td>';
        tb.appendChild(tr);
      }
      tb.querySelectorAll('.combo[data-k="major"]').forEach(function (combo) {
        bindCombo(combo, function () { return master.majors || []; });
      });
      tb.querySelectorAll('.combo[data-k="name"]').forEach(function (combo) {
        bindCombo(combo, function () {
          var i = Number(combo.dataset.i);
          return midsFor(items[i].major);
        });
      });
      setStatus('30行を直接編集できます。候補に無い項目も入力できます。');
    }

    $('tbody').addEventListener('input', function (e) {
      var t = e.target;
      if (!t.dataset || t.dataset.i == null) return;
      if (t.closest('.combo')) return;
      items[Number(t.dataset.i)][t.dataset.k] = t.value;
    });

    document.addEventListener('click', function (e) {
      if (!e.target.closest('.combo')) closeCombos();
    });

    $('btnPrint').addEventListener('click', function () {
      var payload = {
        header: {
          kNo: $('kNo').value,
          plate: $('plate').value,
          staff: $('staff').value,
          inDate: $('inDate').value,
          doneDate: $('doneDate').value,
          billDate: $('billDate').value
        },
        items: items
      };
      $('btnPrint').disabled = true;
      setStatus('印刷用シートを作成しています…');
      google.script.run
        .withSuccessHandler(function (res) {
          $('btnPrint').disabled = false;
          setStatus('完了: ' + res.sheetNames.join('、') + '（入力 ' + res.lineCount + ' 行 / ' + res.pageCount + ' 枚）');
        })
        .withFailureHandler(function (err) {
          $('btnPrint').disabled = false;
          setStatus(err.message || String(err), true);
        })
        .publishInvoices(payload);
    });

    google.script.run
      .withSuccessHandler(function (data) {
        master = data || master;
        renderGrid();
      })
      .withFailureHandler(function (err) {
        setStatus(err.message || String(err), true);
      })
      .getInvoiceMaster();
  </script>
</body>
</html>
