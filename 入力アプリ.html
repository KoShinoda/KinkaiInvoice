<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #fff;
      --line: #d8dee6;
      --text: #1c2430;
      --muted: #667085;
      --accent: #1a6f4c;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Sans", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    header {
      background: #16382c;
      color: #fff;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    header h1 { margin: 0; font-size: 17px; font-weight: 600; }
    header span { font-size: 12px; opacity: .8; }
    main { padding: 14px 18px 132px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px 12px;
    }
    label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    input, select {
      width: 100%;
      min-width: 0;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      font-size: 13px;
      background: #fff;
    }
    input[readonly] { background: #f3f5f7; }
    .table-wrap {
      max-height: min(62vh, 640px);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .table-wrap table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    col.col-no { width: 36px; }
    col.col-ins { width: 36px; }
    col.col-fee { width: calc(96px - 1ch); }
    col.col-staff { width: 108px; }
    col.col-n { width: calc(52px + 2ch); }
    col.col-qty { width: 42px; }
    col.col-amt { width: calc(96px - 1ch); }
    col.col-disc { width: 56px; }
    col.col-del { width: 28px; }
    col.col-major { width: 15%; }
    col.col-mid { width: 25%; }
    col.col-part-major { width: 15%; }
    col.col-part-mid { width: 25%; }
    th {
      position: sticky; top: 0;
      z-index: 2;
      background: #eef3f0;
      font-size: 11px;
      color: var(--muted);
      text-align: left;
      padding: 7px 3px;
      border-bottom: 1px solid var(--line);
    }
    footer.bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: #fff;
      border-top: 1px solid var(--line);
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }
    .foot-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      min-width: 0;
    }
    .foot-sum {
      margin-left: auto;
      flex: 0 0 auto;
    }
    .foot-sum table {
      border-collapse: collapse;
      width: auto;
      margin-left: auto;
      table-layout: auto;
    }
    .foot-sum th,
    .foot-sum td {
      padding: 3px 10px;
      font-size: 13px;
      text-align: right;
      white-space: nowrap;
      border: 0;
      position: static;
      background: transparent;
    }
    .foot-sum thead th {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      position: static;
      background: transparent;
    }
    .foot-sum tbody th {
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      padding-left: 0;
    }
    .foot-sum td.num,
    .foot-sum #techSub,
    .foot-sum #techDiscShow,
    .foot-sum #techTotal,
    .foot-sum #partSub,
    .foot-sum #partDiscShow,
    .foot-sum #partTotal,
    .foot-sum #grand {
      font-variant-numeric: tabular-nums;
      min-width: 5.5em;
    }
    .foot-sum .pct {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }
    .foot-sum .pct input {
      width: 52px;
      padding: 4px 6px;
      text-align: right;
    }
    .foot-sum tr.grand th,
    .foot-sum tr.grand td {
      font-weight: 700;
      font-size: 16px;
      border-top: 1px solid var(--line);
      padding-top: 8px;
      color: var(--text);
    }
    td { padding: 3px 3px; border-bottom: 1px solid #eef1f4; vertical-align: middle; }
    td.no,
    td.ins {
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      padding: 8px 0;
      position: relative;
      overflow: visible;
    }
    td.del { text-align: center; padding: 2px 0; }
    th.del-h { text-align: center; }
    button.side-ins {
      position: absolute;
      left: 50%;
      bottom: -8px;
      z-index: 3;
      width: 16px;
      height: 16px;
      padding: 0;
      margin: 0 0 0 -8px;
      border: 1px solid var(--accent);
      border-radius: 50%;
      background: #fff;
      color: var(--accent);
      font-size: 12px;
      line-height: 14px;
      cursor: pointer;
      opacity: 0;
    }
    th.no-h,
    th.ins-h { text-align: center; }
    button.side-ins.side-ins-top {
      bottom: auto;
      top: -8px;
    }
    tr:has(.side-work:hover) .side-ins[data-side="work"],
    tr:has(.side-part:hover) .side-ins[data-side="part"],
    button.side-ins:hover,
    button.side-ins:focus {
      opacity: 1;
    }
    button.row-del {
      width: 22px;
      height: 22px;
      padding: 0;
      border: 1px solid #f0c4c0;
      border-radius: 6px;
      background: #fff;
      color: var(--danger);
      font-size: 13px;
      line-height: 20px;
      cursor: pointer;
    }
    button.row-del:hover { background: #fde8e8; }
    button.row-del:disabled {
      opacity: .3;
      cursor: default;
      background: #fff;
    }
    td.num input,
    td.fee input { padding: 4px 2px; text-align: right; }
    td.staff input {
      padding: 4px 4px;
      text-align: right;
      flex: 1;
      min-width: 0;
      font-variant-numeric: tabular-nums;
    }
    .staff-wrap {
      display: flex;
      gap: 2px;
      align-items: stretch;
      position: relative;
    }
    .staff-wrap .combo-list {
      min-width: 180px;
      right: auto;
      left: 0;
    }
    button.staff-pick {
      width: 22px;
      flex: 0 0 22px;
      padding: 0;
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--muted);
      font-size: 11px;
      line-height: 20px;
      cursor: pointer;
    }
    button.staff-pick:hover { background: #e8f0ec; color: var(--accent); }
    .worker-picker {
      position: fixed;
      z-index: 80;
      width: auto;
      max-width: calc(100vw - 16px);
      max-height: none;
      overflow: visible;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(28, 36, 48, .16);
      flex-direction: column;
      overflow: visible;
    }
    .worker-picker[hidden] { display: none !important; }
    .worker-picker:not([hidden]) { display: flex; }
    .worker-picker-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      font-weight: 600;
    }
    .worker-picker-bar {
      display: flex;
      gap: 6px;
      padding: 6px 10px 4px;
      align-items: center;
    }
    .worker-picker-bar input {
      flex: 1;
      min-width: 160px;
      padding: 5px 8px;
    }
    button.worker-picker-x {
      width: 28px;
      flex: 0 0 28px;
      padding: 0;
      margin: 0;
      background: #fff;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 16px;
      line-height: 26px;
    }
    button.worker-picker-x:hover { background: #fde8e8; color: var(--danger); }
    .worker-picker-meta {
      padding: 0 10px 6px;
      font-size: 11px;
      color: var(--muted);
    }
    .worker-picker-boards {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: flex-start;
      gap: 10px;
      padding: 0 10px 10px;
      overflow: visible;
    }
    table.worker-board {
      width: auto;
      border-collapse: collapse;
      table-layout: auto;
      border: 1px solid var(--line);
      flex: 0 0 auto;
    }
    .worker-picker th {
      position: static;
      background: #eef3f0;
      font-size: 11px;
      color: var(--muted);
      text-align: left;
      padding: 3px 6px;
      border-bottom: 1px solid var(--line);
    }
    .worker-picker th.worker-code,
    .worker-picker td.worker-code {
      text-align: right;
      width: 3ch;
      max-width: 3ch;
      padding-left: 2px;
      padding-right: 4px;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      box-sizing: content-box;
    }
    .worker-picker th.worker-code {
      white-space: nowrap;
      width: auto;
      max-width: none;
    }
    .worker-picker td {
      padding: 2px 6px;
      font-size: 12px;
      border-bottom: 1px solid #eef1f4;
      cursor: pointer;
      white-space: nowrap;
      vertical-align: middle;
      height: 22px;
      line-height: 1.2;
    }
    .worker-picker tbody tr:hover td { background: #e8f0ec; }
    .worker-picker tbody tr.active td { background: #dce8e2; }
    .worker-picker tr.worker-pad td {
      cursor: default;
      background: #fafbfb;
      border-bottom: 1px solid #f0f2f4;
    }
    .worker-picker td.worker-img { width: 28px; padding: 1px 4px; }
    .worker-picker td.worker-img img {
      display: block;
      max-width: 22px;
      max-height: 20px;
      object-fit: contain;
    }
    .worker-empty-msg {
      padding: 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .grid.header-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .date-wrap {
      display: flex;
      gap: 4px;
      align-items: stretch;
    }
    .date-wrap .date-text { flex: 1; min-width: 0; }
    .date-wrap .date-cal {
      width: 34px;
      padding: 4px 2px;
      flex: 0 0 34px;
    }
    .combo { position: relative; }
    .combo input { width: 100%; }
    .combo textarea {
      width: 100%;
      resize: none;
      overflow: hidden;
      min-height: 28px;
      line-height: 1.35;
      padding: 6px 8px;
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 7px;
      box-sizing: border-box;
    }
    td.mid { vertical-align: top; }
    .combo-list {
      position: absolute;
      left: 0; right: 0; top: 100%;
      z-index: 20;
      max-height: 180px;
      overflow: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 6px 16px rgba(28, 36, 48, .12);
    }
    .combo-list div { padding: 5px 8px; cursor: pointer; }
    .combo-list div:hover,
    .combo-list div.active { background: #e8f0ec; }
    input.warn-neg {
      background: #fde8e8;
      color: #b42318;
      border-color: #f04438;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 14px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button:disabled { opacity: .5; cursor: wait; }
    .template-bar {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 10px;
    }
    .template-bar > div { min-width: 280px; max-width: 420px; }
    .template-bar label { margin-bottom: 3px; }
    #status { color: var(--muted); font-size: 13px; }
    #status.err { color: var(--danger); }
  </style>
</head>
<body>
  <header>
    <h1>車検 請求入力</h1>
    <span>ヘッダーは整備情報マスタ連動　／　日付はカレンダーまたは yyyymmdd</span>
  </header>
  <main>
    <section class="card">
      <h2>ヘッダー</h2>
      <div class="grid header-grid">
        <div><label>ユーザー</label><input id="userName"></div>
        <div><label>K-No</label><input id="kNo"></div>
        <div><label>登録番号</label><input id="plate"></div>
        <div><label>整備部門</label><select id="dept"></select></div>
        <div><label>整備種別</label><select id="serviceType"></select></div>
        <div><label>受付担当</label><select id="receptionist"></select></div>
        <div>
          <label>入庫日</label>
          <div class="date-wrap">
            <input id="inDate" class="date-text" placeholder="yyyy/mm/dd" autocomplete="off">
            <input id="inDateCal" class="date-cal" type="date" tabindex="-1" title="カレンダー">
          </div>
        </div>
        <div>
          <label>出庫日</label>
          <div class="date-wrap">
            <input id="outDate" class="date-text" placeholder="yyyy/mm/dd" autocomplete="off">
            <input id="outDateCal" class="date-cal" type="date" tabindex="-1" title="カレンダー">
          </div>
        </div>
        <div>
          <label>請求日</label>
          <div class="date-wrap">
            <input id="billDate" class="date-text" placeholder="yyyy/mm/dd" autocomplete="off">
            <input id="billDateCal" class="date-cal" type="date" tabindex="-1" title="カレンダー">
          </div>
        </div>
      </div>
    </section>
    <section class="card">
      <h2>明細（120行・表内スクロール）　大項目はリスト選択　／　中項目は入力可</h2>
      <div class="template-bar">
        <div>
          <label>明細テンプレート</label>
          <select id="invoiceTemplate"></select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <colgroup>
            <col class="col-no">
            <col class="col-major">
            <col class="col-mid">
            <col class="col-fee">
            <col class="col-staff">
            <col class="col-del">
            <col class="col-ins">
            <col class="col-part-major">
            <col class="col-part-mid">
            <col class="col-n">
            <col class="col-qty">
            <col class="col-amt">
            <col class="col-disc">
            <col class="col-del">
          </colgroup>
          <thead>
            <tr>
              <th class="no-h">#</th>
              <th>大項目</th>
              <th>中項目</th>
              <th>技術料</th>
              <th>作業コード</th>
              <th class="del-h" title="技術側">削</th>
              <th class="ins-h"></th>
              <th>部品大項目</th>
              <th>部品中項目</th>
              <th>単価</th>
              <th>数量</th>
              <th>合計</th>
              <th>値引額</th>
              <th class="del-h" title="部品側">削</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer class="bar">
    <div class="foot-left">
      <div id="status">読み込み中…</div>
      <button type="button" id="btnPrint">印刷用シートを作成</button>
    </div>
    <div class="foot-sum">
      <table>
        <thead>
          <tr>
            <th></th>
            <th>小計</th>
            <th>値引額</th>
            <th>値引％</th>
            <th>差引</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th>技術料</th>
            <td id="techSub">0</td>
            <td id="techDiscShow">0</td>
            <td>
              <div class="pct"><input id="techPct" type="number" min="0" max="100" step="1" value="3">％</div>
            </td>
            <td id="techTotal">0</td>
          </tr>
          <tr>
            <th>部品</th>
            <td id="partSub">0</td>
            <td id="partDiscShow">0</td>
            <td>
              <div class="pct"><input id="partPct" type="number" min="0" max="100" step="1" value="10">％</div>
            </td>
            <td id="partTotal">0</td>
          </tr>
          <tr class="grand">
            <th colspan="4">総合計</th>
            <td id="grand">0</td>
          </tr>
        </tbody>
      </table>
    </div>
  </footer>
  <div id="workerPicker" class="worker-picker" hidden>
    <div class="worker-picker-head">
      <span>作業者リスト</span>
      <button type="button" id="workerPickerClose" class="worker-picker-x" title="閉じる">×</button>
    </div>
    <div class="worker-picker-bar">
      <input id="workerPickerFilter" placeholder="コード・名前で絞り込み" autocomplete="off">
    </div>
    <div id="workerPickerMeta" class="worker-picker-meta"></div>
    <div id="workerPickerBoards" class="worker-picker-boards"></div>
  </div>

  <script>
    var master = {
      majors: [], allMids: [], midsByMajor: {}, workLines: [],
      partMajors: [], allPartMids: [], partMidsByMajor: {}, partLines: [],
      workerCodes: [],
      workers: [],
      workerHeaders: ['コード', '名前'],
      departments: [],
      typesByDept: {},
      typeSlotsByDept: {},
      allServiceTypes: [],
      receptionists: [],
      templateNames: [],
      lineCount: 120
    };
    var items = [];
    var pendingFocus = null;
    var comboActiveIndex = -1;
    var comboIgnoreBlur = false;

    function $(id) { return document.getElementById(id); }
    function setStatus(msg, isErr) {
      $('status').textContent = msg;
      $('status').className = isErr ? 'err' : '';
    }
    function emptyRow() {
      return {
        major: '', mid: '', fee: '', workerCode: '', workerName: '',
        partMajor: '', partMid: '',
        qty: '', unitPrice: '', amount: '', discYen: 0,
        kind: ''
      };
    }
    function yen(n) { return Math.round(n || 0).toLocaleString('ja-JP'); }
    function filled(v) {
      if (v === 0 || v === '0') return true;
      return String(v == null ? '' : v).replace(/\u3000/g, ' ').trim() !== '';
    }
    function num(v) {
      var n = Number(String(v == null ? '' : v).replace(/,/g, ''));
      return isFinite(n) ? n : 0;
    }
    function pad2(n) {
      return (n < 10 ? '0' : '') + n;
    }
    function formatYmd(raw) {
      var s = String(raw == null ? '' : raw).trim();
      if (!s) return '';
      var iso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (iso) {
        return iso[1] + '/' + pad2(Number(iso[2])) + '/' + pad2(Number(iso[3]));
      }
      var slash = s.match(/^(\d{4})[\/\.年](\d{1,2})[\/\.月](\d{1,2})/);
      if (slash) {
        return slash[1] + '/' + pad2(Number(slash[2])) + '/' + pad2(Number(slash[3]));
      }
      var digits = s.replace(/\D/g, '');
      if (digits.length === 8) {
        return digits.slice(0, 4) + '/' + digits.slice(4, 6) + '/' + digits.slice(6, 8);
      }
      return s;
    }
    function ymdToIso(ymd) {
      var m = String(ymd || '').match(/^(\d{4})\/(\d{2})\/(\d{2})$/);
      return m ? m[1] + '-' + m[2] + '-' + m[3] : '';
    }
    function applyDateField(textId, calId, formatted) {
      $(textId).value = formatted;
      var iso = ymdToIso(formatted);
      $(calId).value = iso;
    }
    function bindDateField(textId, calId, onSet) {
      var text = $(textId);
      var cal = $(calId);
      function commit(raw, fromCal) {
        var f = formatYmd(raw);
        applyDateField(textId, calId, f);
        if (onSet) onSet(f, fromCal);
      }
      text.addEventListener('blur', function () { commit(text.value, false); });
      text.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          commit(text.value, false);
        }
      });
      cal.addEventListener('change', function () {
        if (cal.value) commit(cal.value, true);
      });
    }

    function allServiceTypes() {
      if (master.allServiceTypes && master.allServiceTypes.length) {
        return master.allServiceTypes.slice();
      }
      var acc = [];
      var map = master.typesByDept || {};
      Object.keys(map).forEach(function (d) {
        (map[d] || []).forEach(function (t) {
          if (t && acc.indexOf(t) === -1) acc.push(t);
        });
      });
      return acc;
    }
    function typesForDept(dept) {
      var types = !dept
        ? allServiceTypes()
        : ((master.typesByDept && master.typesByDept[dept]) || []).slice();
      if (dept === '部品販売' && types.indexOf('部品販売') === -1) {
        types.push('部品販売');
      }
      if ((dept === 'BP板金' || dept === '板金塗装') && types.indexOf('板金塗装') === -1) {
        types.push('板金塗装');
      }
      return types;
    }
    function fillHeaderSelect(sel, values, selected) {
      fillSelect(sel, values, selected);
    }
    function pickPreferredType(dept) {
      if (dept === '部品販売') return '部品販売';
      if (dept === 'BP板金' || dept === '板金塗装') return '板金塗装';
      return '';
    }
    function applyDeptDefaults() {
      var dept = $('dept').value;
      var types = typesForDept(dept);
      var cur = $('serviceType').value;
      var next = pickPreferredType(dept);
      if (!next) {

    function clampPct(v) {

    function listPrice(it) { return num(it.qty) * num(it.unitPrice); }

    function hasWork(r) {

    function applyWorkOnto(target, src) {

    function refreshKind(r) {

    function shiftSideUp(start, side) {

    function midsFor(major) {

    }
    function sortMasterLines(arr) {
      return (arr || []).slice().sort(function (a, b) {

    var optHtml = { major: '', partMajor: '' };
    var midsJsonByMajor = {};
    var partMidsJsonByMajor = {};
    var gridReady = false;

    function htmlEscape(s) {

    function optionHtml(values) {

    function refreshOptionCache() {

    function setSelectValue(sel, values, selected) {

    function bindRowCells(tr) {

    function buildGrid() {

    function rowIsEmpty(r) {

        !filled(r.qty) && !filled(r.unitPrice) && !filled(r.amount));

    function padItems() {

    function packRowList(src) {
      var pendingW = [];

    function canMergeExpand(r, kind) {

      return false;
    }

    function writeBelow(rowIndex, kind, details) {
      var side = kind === 'part' ? 'part' : 'work';

      var start = rowIndex + 1;
      var d = details.length;
      var c;
      for (c = 0; c < d; c++) shiftSideDown(start, side);
      for (c = 0; c < d; c++) {
        var t = items[start + c];
        if (!t) break;
        if (side === 'work') {
          copyWorkFields(t, details[c]);
          if (hasPart(details[c])) copyPartFields(t, details[c]);

    function firstFilled(rows, key) {

    }

    function copyWorkPart(target, w) {
      if (!w || (!w.partMajor && !w.partMid)) return;
      if (w.partMajor) target.partMajor = w.partMajor;
      if (w.partMid) target.partMid = w.partMid;
      if (filled(w.qty)) target.qty = w.qty;
      if (filled(w.unitPrice)) target.unitPrice = w.unitPrice;

    var lastExpandKey = '';
    function alreadyExpanded(key) {
      if (lastExpandKey === key) return true;
      lastExpandKey = key;
      return false;
    }

    function onMidChosen(rowIndex) {
      var it = items[rowIndex];
      var mid = String(it.mid || '').trim();
      it.mid = mid;
      it.kind = it.kind === 'part' ? it.kind : 'mid';
      if (!mid) {
        lastExpandKey = '';
        it.fee = '';
        compactItems();
        renderGrid();
        return;
      }
      if (alreadyExpanded('mid:' + rowIndex + ':' + mid)) return;
      var group = linesForMid(it.major, mid);
      if (!group.length) group = linesForMid('', mid);
      var works = group.filter(function (r) { return filled(r.content); });
      var blanks = group.filter(function (r) { return !filled(r.content); });
      if (!it.major && group[0] && group[0].major) it.major = group[0].major;

      if (works.length === 0) {
        var only = group[0];
        it.fee = only ? only.fee : it.fee;
        if (only && !it.major && only.major) it.major = only.major;
        if (only) copyWorkPart(it, only);
        compactItems();
        renderGrid();
        setStatus('中項目「' + mid + '」を入力しました');
        return;
      }

      it.fee = firstFilled(blanks, 'fee');
      var details = works.map(function (w) {
        var row = emptyRow();
        row.major = it.major || w.major || '';
        row.mid = w.content;
        row.fee = w.fee;
        row.workerCode = it.workerCode || '';
        row.workerName = it.workerName || '';
        row.kind = 'work';
        copyWorkPart(row, w);
        return row;
      });
      blanks.forEach(function (b) {
        if (!b.partMajor && !b.partMid) return;
        var row = emptyRow();
        row.kind = 'work';
        copyWorkPart(row, b);
        details.push(row);
      });
      writeBelow(rowIndex, 'work', details);
      renderGrid();
      setStatus('中項目「' + mid + '」の作業内容 ' + works.length + ' 件を下行へ出力しました');
    }

    function onPartMidChosen(rowIndex) {
      var it = items[rowIndex];
      var mid = String(it.partMid || '').trim();
      it.partMid = mid;
      if (!mid) {
        lastExpandKey = '';
        compactItems();
        renderGrid();
        return;
      }
      if (alreadyExpanded('part:' + rowIndex + ':' + mid)) return;
      var group = linesForPartMid(it.partMajor, mid);

    function recalc() {

      });
      var techPct = clampPct($('techPct').value);
      $('techPct').value = techPct;

      var partPct = clampPct($('partPct').value);
      $('partPct').value = partPct;
      var partExtra = Math.round(partList * partPct / 100);
      var partDisc = partLineDisc + partExtra;

      var partNet = Math.max(0, partList - partDisc);

      $('techSub').textContent = yen(techSum);
      $('techDiscShow').textContent = yen(techDisc);
      $('techTotal').textContent = yen(techNet);
      $('partSub').textContent = yen(partList);
      $('partDiscShow').textContent = yen(partDisc);
      $('partTotal').textContent = yen(partNet);
      $('grand').textContent = yen(techNet + partNet);
      return {
        techSub: techSum,

        techTotal: techNet,
        partSub: partList,
        partDisc: partDisc,
        partTotal: partNet,
        grand: techNet + partNet

      };
      $('btnPrint').disabled = true;
      setStatus('印刷用シートを作成しています…');
      google.script.run
        .withSuccessHandler(function (res) {
          $('btnPrint').disabled = false;
          setStatus('完了: ' + res.sheetNames.join('、') + '（入力 ' + res.lineCount + ' 行 / ' + res.pageCount + ' 枚）');
        })
        .withFailureHandler(function (err) {
          $('btnPrint').disabled = false;
          setStatus(err.message || String(err), true);
        })
        .publishInvoices(payload);
    });

    google.script.run
      .withSuccessHandler(function (data) {
        master = data || master;
        refreshOptionCache();
        fillWorkerPicker();
        renderGrid();
        initHeaderMasters();
        bindDateField('inDate', 'inDateCal');
        bindDateField('outDate', 'outDateCal', function (f) {
          if (f) applyDateField('billDate', 'billDateCal', f);
        });
        bindDateField('billDate', 'billDateCal');
        $('dept').addEventListener('change', applyDeptDefaults);
        $('invoiceTemplate').addEventListener('change', onTemplatePicked);
        setStatus('ヘッダーは整備情報マスタ、日付はカレンダーまたは yyyymmdd で入力できます。');
      })
      .withFailureHandler(function (err) {
        setStatus(err.message || String(err), true);
      })
      .getInvoiceMaster();

    google.script.run
      .withSuccessHandler(function (names) {
        master.templateNames = names || [];
        if ($('invoiceTemplate')) {
          fillHeaderSelect($('invoiceTemplate'), master.templateNames, $('invoiceTemplate').value);
        }
      })
      .getInvoiceTemplateNames();
  </script>
</body>
</html>
