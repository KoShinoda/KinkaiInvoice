<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #fff;
      --line: #d8dee6;
      --text: #1c2430;
      --muted: #667085;
      --accent: #1a6f4c;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Sans", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    header {
      background: #16382c;
      color: #fff;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    header h1 { margin: 0; font-size: 17px; font-weight: 600; }
    header span { font-size: 12px; opacity: .8; }
    main { padding: 14px 18px 96px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px 12px;
    }
    label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    input, select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      font-size: 13px;
      background: #fff;
    }
    .table-wrap {
      max-height: 340px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      position: sticky; top: 0;
      background: #eef3f0;
      font-size: 11px;
      color: var(--muted);
      text-align: left;
      padding: 7px 5px;
      border-bottom: 1px solid var(--line);
    }
    tfoot th {
      position: sticky; bottom: 0;
      background: #e8f0ec;
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
    }
    td { padding: 3px 4px; border-bottom: 1px solid #eef1f4; }
    td.no { width: 26px; color: var(--muted); text-align: center; }
    td.num { width: 72px; }
    td.major { width: 16%; }
    td.mid { width: 18%; }
    td.content { width: 22%; }
    .combo { position: relative; }
    .combo input { width: 100%; }
    .combo-list {
      position: absolute;
      left: 0; right: 0; top: 100%;
      z-index: 20;
      max-height: 180px;
      overflow: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 6px 16px rgba(28, 36, 48, .12);
    }
    .combo-list div {
      padding: 5px 8px;
      cursor: pointer;
    }
    .combo-list div:hover,
    .combo-list div.active { background: #e8f0ec; }
    .totals {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .totals h3 { margin: 0 0 8px; font-size: 13px; }
    .disc {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 8px 0;
    }
    .sum-line {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 13px;
    }
    .sum-line.strong { font-weight: 700; font-size: 15px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 14px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button:disabled { opacity: .5; cursor: wait; }
    footer.bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: #fff;
      border-top: 1px solid var(--line);
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #status { color: var(--muted); font-size: 13px; }
    #status.err { color: var(--danger); }
  </style>
</head>
<body>
  <header>
    <h1>車検 請求入力</h1>
    <span>30行を直接編集　／　中項目は入力可　／　複数なら下行へ作業内容を展開</span>
  </header>
  <main>
    <section class="card">
      <h2>ヘッダー</h2>
      <div class="grid">
        <div><label>K-No</label><input id="kNo"></div>
        <div><label>登録番号</label><input id="plate"></div>
        <div><label>担当</label><input id="staff"></div>
        <div><label>入庫日</label><input id="inDate"></div>
        <div><label>完成日</label><input id="doneDate"></div>
        <div><label>請求日</label><input id="billDate"></div>
      </div>
    </section>
    <section class="card">
      <h2>明細（30行）　中項目は入力可　／　作業内容・部品大項目はリスト選択のみ</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>大項目</th>
              <th>中項目</th>
              <th>作業内容</th>
              <th>技術料</th>
              <th>部品大項目</th>
              <th>数量</th>
              <th>単価</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
          <tfoot>
            <tr>
              <th></th>
              <th colspan="3">合計</th>
              <th id="footTech">0</th>
              <th>数量×単価</th>
              <th colspan="2" id="footPart">0</th>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>
    <section class="card">
      <h2>合計・値引</h2>
      <div class="totals">
        <div>
          <h3>技術料</h3>
          <div class="sum-line"><span>合計</span><span id="techSub">0</span></div>
          <div class="disc">
            <div><label>値引（円）</label><input id="techYen" type="number" value="0"></div>
            <div><label>値引（%）</label><input id="techPct" type="number" value="0" step="0.1"></div>
          </div>
          <div class="sum-line"><span>値引額</span><span id="techDisc">0</span></div>
          <div class="sum-line strong"><span>差引</span><span id="techTotal">0</span></div>
        </div>
        <div>
          <h3>部品（数量×単価）</h3>
          <div class="sum-line"><span>合計</span><span id="partSub">0</span></div>
          <div class="disc">
            <div><label>値引（円）</label><input id="partYen" type="number" value="0"></div>
            <div><label>値引（%）</label><input id="partPct" type="number" value="0" step="0.1"></div>
          </div>
          <div class="sum-line"><span>値引額</span><span id="partDisc">0</span></div>
          <div class="sum-line strong"><span>差引</span><span id="partTotal">0</span></div>
        </div>
      </div>
      <div class="sum-line strong" style="margin-top:12px;"><span>総合計</span><span id="grand">0</span></div>
    </section>
  </main>
  <footer class="bar">
    <div id="status">読み込み中…</div>
    <button type="button" id="btnPrint">印刷用シートを作成</button>
  </footer>

  <script>
    var master = { majors: [], allMids: [], midsByMajor: {}, workLines: [], partMajors: [], linesPerPage: 30 };
    var items = [];

    function $(id) { return document.getElementById(id); }
    function setStatus(msg, isErr) {
      $('status').textContent = msg;
      $('status').className = isErr ? 'err' : '';
    }
    function emptyRow() {
      return { major: '', mid: '', name: '', fee: '', part: '', qty: '', unitPrice: '', kind: '' };
    }
    function yen(n) {
      return Math.round(n || 0).toLocaleString('ja-JP');
    }
    function num(v) {
      var n = Number(String(v == null ? '' : v).replace(/,/g, ''));
      return isFinite(n) ? n : 0;
    }
    function filled(v) {
      return v !== '' && v != null;
    }

    function midsFor(major) {
      if (!major) return master.allMids || [];
      return (master.midsByMajor && master.midsByMajor[major]) || [];
    }

    function contentsFor(major, mid) {
      var lines = master.workLines || [];
      var out = [];
      var seen = {};
      lines.forEach(function (r) {
        if (!r.content) return;
        if (major && r.major !== major) return;
        if (mid && r.mid !== mid) return;
        if (seen[r.content]) return;
        seen[r.content] = true;
        out.push(r.content);
      });
      return out;
    }

    function linesForMid(major, mid) {
      return (master.workLines || []).filter(function (r) {
        if (String(r.mid || '') !== String(mid || '')) return false;
        if (major && r.major !== major) return false;
        return true;
      });
    }

    function fillSelect(sel, values, selected) {
      var cur = selected == null ? sel.value : selected;
      sel.innerHTML = '';
      var z = document.createElement('option');
      z.value = '';
      z.textContent = '';
      sel.appendChild(z);
      (values || []).forEach(function (v) {
        var o = document.createElement('option');
        o.value = v;
        o.textContent = v;
        sel.appendChild(o);
      });
      if (cur) {
        if (!values || values.indexOf(cur) === -1) {
          var extra = document.createElement('option');
          extra.value = cur;
          extra.textContent = cur;
          sel.appendChild(extra);
        }
        sel.value = cur;
      }
    }

    function refreshRowSelects(i) {
      var tr = $('tbody').rows[i];
      if (!tr) return;
      var it = items[i];
      fillSelect(tr.querySelector('select[data-k="major"]'), master.majors, it.major);
      var midInput = tr.querySelector('input[data-k="mid"]');
      if (midInput) {
        midInput.value = it.mid || '';
        midInput.dataset.options = JSON.stringify(midsFor(it.major));
      }
      fillSelect(tr.querySelector('select[data-k="name"]'), contentsFor(it.major, it.mid), it.name);
      fillSelect(tr.querySelector('select[data-k="part"]'), master.partMajors, it.part);
      tr.querySelector('[data-k="fee"]').value = it.fee == null ? '' : it.fee;
      tr.querySelector('[data-k="qty"]').value = it.qty == null ? '' : it.qty;
      tr.querySelector('[data-k="unitPrice"]').value = it.unitPrice == null ? '' : it.unitPrice;
    }

    function renderGrid() {
      var n = master.linesPerPage || 30;
      while (items.length < n) items.push(emptyRow());
      items = items.slice(0, n);
      var tb = $('tbody');
      tb.innerHTML = '';
      for (var i = 0; i < n; i++) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="no">' + (i + 1) + '</td>' +
          '<td class="major"><select data-i="' + i + '" data-k="major"></select></td>' +
          '<td class="mid"><div class="combo"><input data-i="' + i + '" data-k="mid" autocomplete="off"><div class="combo-list" hidden></div></div></td>' +
          '<td class="content"><select data-i="' + i + '" data-k="name"></select></td>' +
          '<td class="num"><input data-i="' + i + '" data-k="fee"></td>' +
          '<td><select data-i="' + i + '" data-k="part"></select></td>' +
          '<td class="num"><input data-i="' + i + '" data-k="qty"></td>' +
          '<td class="num"><input data-i="' + i + '" data-k="unitPrice"></td>';
        tb.appendChild(tr);
        refreshRowSelects(i);
      }
      recalc();
    }

    function rowIsEmpty(r) {
      return !r || (!r.major && !r.mid && !r.name && !filled(r.fee) && !r.part && !filled(r.qty) && !filled(r.unitPrice));
    }

    function padItems() {
      var n = master.linesPerPage || 30;
      while (items.length < n) items.push(emptyRow());
      items = items.slice(0, n);
    }

    function clearExpandedBelow(rowIndex) {
      var j = rowIndex + 1;
      while (j < items.length) {
        var r = items[j];
        if (r.kind === 'work' || rowIsEmpty(r)) {
          items.splice(j, 1);
          continue;
        }
        break;
      }
    }

    function midFeeFrom(blanks) {
      for (var i = 0; i < blanks.length; i++) {
        if (filled(blanks[i].fee)) return blanks[i].fee;
      }
      return '';
    }

    function onMidChosen(rowIndex) {
      var it = items[rowIndex];
      var mid = String(it.mid || '').trim();
      it.mid = mid;
      it.kind = 'mid';
      if (!mid) {
        it.name = '';
        it.fee = '';
        clearExpandedBelow(rowIndex);
        padItems();
        renderGrid();
        return;
      }
      var group = linesForMid(it.major, mid);
      if (!group.length && it.major) {
        group = linesForMid('', mid);
        if (group.length && !it.major) it.major = group[0].major;
      }
      var works = group.filter(function (r) { return r.content; });
      var blanks = group.filter(function (r) { return !r.content; });

      clearExpandedBelow(rowIndex);
      it.name = '';

      if (group.length <= 1) {
        var only = group[0];
        it.fee = only ? only.fee : '';
        if (only && !it.major && only.major) it.major = only.major;
        padItems();
        renderGrid();
        setStatus('中項目「' + mid + '」を入力しました');
        return;
      }

      it.fee = midFeeFrom(blanks);
      works.forEach(function (w, k) {
        items.splice(rowIndex + 1 + k, 0, {
          major: it.major || w.major || '',
          mid: '',
          name: w.content,
          fee: w.fee,
          part: w.part || '',
          qty: w.qty || '',
          unitPrice: w.unitPrice || '',
          kind: 'work'
        });
      });
      padItems();
      renderGrid();
      setStatus('中項目「' + mid + '」の作業内容 ' + works.length + ' 件を下行へ展開しました');
    }

    function hideComboLists(except) {
      Array.prototype.forEach.call(document.querySelectorAll('.combo-list'), function (el) {
        if (el !== except) el.hidden = true;
      });
    }

    function comboOptions(input) {
      try {
        return JSON.parse(input.dataset.options || '[]');
      } catch (e) {
        return [];
      }
    }

    function showComboList(input) {
      var list = input.parentNode.querySelector('.combo-list');
      if (!list) return;
      var q = String(input.value || '').toLowerCase();
      var opts = comboOptions(input).filter(function (v) {
        return !q || String(v).toLowerCase().indexOf(q) !== -1;
      });
      list.innerHTML = '';
      opts.forEach(function (v) {
        var d = document.createElement('div');
        d.textContent = v;
        d.dataset.value = v;
        list.appendChild(d);
      });
      list.hidden = opts.length === 0;
    }

    $('tbody').addEventListener('mousedown', function (e) {
      var opt = e.target.closest('.combo-list div');
      if (!opt) return;
      e.preventDefault();
      var input = opt.parentNode.parentNode.querySelector('input');
      var i = Number(input.dataset.i);
      input.value = opt.dataset.value;
      items[i].mid = opt.dataset.value;
      hideComboLists();
      onMidChosen(i);
    });

    $('tbody').addEventListener('focusin', function (e) {
      if (e.target.dataset && e.target.dataset.k === 'mid') {
        hideComboLists();
        showComboList(e.target);
      }
    });

    $('tbody').addEventListener('keydown', function (e) {
      if (!e.target.dataset || e.target.dataset.k !== 'mid') return;
      if (e.key === 'Enter') {
        e.preventDefault();
        hideComboLists();
        items[Number(e.target.dataset.i)].mid = e.target.value;
        onMidChosen(Number(e.target.dataset.i));
      }
    });

    $('tbody').addEventListener('focusout', function (e) {
      if (!e.target.dataset || e.target.dataset.k !== 'mid') return;
      var input = e.target;
      setTimeout(function () {
        hideComboLists();
        var i = Number(input.dataset.i);
        if (!items[i]) return;
        if (items[i].mid === input.value) return;
        items[i].mid = input.value;
        onMidChosen(i);
      }, 120);
    });

    $('tbody').addEventListener('change', function (e) {
      var t = e.target;
      if (!t.dataset || t.dataset.i == null) return;
      var i = Number(t.dataset.i);
      var k = t.dataset.k;
      if (k === 'mid') return;
      items[i][k] = t.value;
      if (k === 'major') {
        items[i].mid = '';
        items[i].name = '';
        refreshRowSelects(i);
      } else {
        recalc();
      }
    });

    $('tbody').addEventListener('input', function (e) {
      var t = e.target;
      if (!t.dataset || t.tagName !== 'INPUT') return;
      var i = Number(t.dataset.i);
      var k = t.dataset.k;
      if (k === 'mid') {
        showComboList(t);
        return;
      }
      items[i][k] = t.value;
      recalc();
    });

    ['techYen', 'techPct', 'partYen', 'partPct'].forEach(function (id) {
      $(id).addEventListener('input', recalc);
    });

    function recalc() {
      var techSum = 0;
      var partSum = 0;
      items.forEach(function (it) {
        techSum += num(it.fee);
        partSum += num(it.qty) * num(it.unitPrice);
      });
      var techDisc = num($('techYen').value) + techSum * num($('techPct').value) / 100;
      var partDisc = num($('partYen').value) + partSum * num($('partPct').value) / 100;
      var techNet = Math.max(0, techSum - techDisc);
      var partNet = Math.max(0, partSum - partDisc);
      $('techSub').textContent = yen(techSum);
      $('techDisc').textContent = yen(techDisc);
      $('techTotal').textContent = yen(techNet);
      $('partSub').textContent = yen(partSum);
      $('partDisc').textContent = yen(partDisc);
      $('partTotal').textContent = yen(partNet);
      $('grand').textContent = yen(techNet + partNet);
      if ($('footTech')) $('footTech').textContent = yen(techSum);
      if ($('footPart')) $('footPart').textContent = yen(partSum);
      return {
        techSub: techSum,
        techDisc: techDisc,
        techTotal: techNet,
        partSub: partSum,
        partDisc: partDisc,
        partTotal: partNet,
        grand: techNet + partNet
      };
    }

    $('btnPrint').addEventListener('click', function () {
      var summary = recalc();
      var payload = {
        header: {
          kNo: $('kNo').value,
          plate: $('plate').value,
          staff: $('staff').value,
          inDate: $('inDate').value,
          doneDate: $('doneDate').value,
          billDate: $('billDate').value
        },
        items: items,
        summary: summary
      };
      $('btnPrint').disabled = true;
      setStatus('印刷用シートを作成しています…');
      google.script.run
        .withSuccessHandler(function (res) {
          $('btnPrint').disabled = false;
          setStatus('完了: ' + res.sheetNames.join('、') + '（入力 ' + res.lineCount + ' 行 / ' + res.pageCount + ' 枚）');
        })
        .withFailureHandler(function (err) {
          $('btnPrint').disabled = false;
          setStatus(err.message || String(err), true);
        })
        .publishInvoices(payload);
    });

    google.script.run
      .withSuccessHandler(function (data) {
        master = data || master;
        renderGrid();
        setStatus('30行を編集できます。中項目は入力、作業内容・部品はリスト選択です。');
      })
      .withFailureHandler(function (err) {
        setStatus(err.message || String(err), true);
      })
      .getInvoiceMaster();
  </script>
</body>
</html>
