<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #fff;
      --line: #d8dee6;
      --text: #1c2430;
      --muted: #667085;
      --accent: #1a6f4c;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Sans", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    header {
      background: #16382c;
      color: #fff;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    header h1 { margin: 0; font-size: 17px; font-weight: 600; }
    header span { font-size: 12px; opacity: .8; }
    main { padding: 14px 18px 96px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px 12px;
    }
    label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    input[readonly] { background: #f3f5f7; }
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      font-size: 13px;
      background: #fff;
    }
    .table-wrap {
      max-height: 380px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      position: sticky; top: 0;
      background: #eef3f0;
      font-size: 11px;
      color: var(--muted);
      text-align: left;
      padding: 7px 5px;
      border-bottom: 1px solid var(--line);
    }
    tfoot th {
      position: sticky; bottom: auto;
      background: #e8f0ec;
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
    }
    td { padding: 3px 4px; border-bottom: 1px solid #eef1f4; }
    td.no { width: 26px; color: var(--muted); text-align: center; }
    td.num { width: 70px; }
    td.pct { width: 64px; }
    td.major, td.part-major { width: 12%; }
    td.mid, td.part-mid { width: 14%; }
    .combo { position: relative; }
    .combo input { width: 100%; }
    .combo-list {
      position: absolute;
      left: 0; right: 0; top: 100%;
      z-index: 20;
      max-height: 180px;
      overflow: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 6px 16px rgba(28, 36, 48, .12);
    }
    .combo-list div { padding: 5px 8px; cursor: pointer; }
    .combo-list div:hover { background: #e8f0ec; }
    .totals {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .totals h3 { margin: 0 0 8px; font-size: 13px; }
    .disc { margin: 8px 0; max-width: 160px; }
    .sum-line {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 13px;
    }
    .sum-line.strong { font-weight: 700; font-size: 15px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 14px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button:disabled { opacity: .5; cursor: wait; }
    footer.bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: #fff;
      border-top: 1px solid var(--line);
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #status { color: var(--muted); font-size: 13px; }
    #status.err { color: var(--danger); }
  </style>
</head>
<body>
  <header>
    <h1>車検 請求入力</h1>
    <span>明細は詰めて表示　／　合計は数量×単価　／　値引額＝合計−請求</span>
  </header>
  <main>
    <section class="card">
      <h2>ヘッダー</h2>
      <div class="grid">
        <div><label>K-No</label><input id="kNo"></div>
        <div><label>登録番号</label><input id="plate"></div>
        <div><label>担当</label><input id="staff"></div>
        <div><label>入庫日</label><input id="inDate"></div>
        <div><label>完成日</label><input id="doneDate"></div>
        <div><label>請求日</label><input id="billDate"></div>
      </div>
    </section>
    <section class="card">
      <h2>明細（30行）　大項目はリスト選択　／　中項目は入力可</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>大項目</th>
              <th>中項目</th>
              <th>技術料</th>
              <th>部品大項目</th>
              <th>部品中項目</th>
              <th>単価</th>
              <th>数量</th>
              <th>合計</th>
              <th>値引額</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
          <tfoot>
            <tr>
              <th></th>
              <th colspan="2">作業 合計</th>
              <th id="footTech">0</th>
              <th colspan="2">部品 合計</th>
              <th></th>
              <th></th>
              <th id="footPartAmt">0</th>
              <th id="footPartDisc">0</th>
            </tr>
            <tr>
              <th></th>
              <th colspan="2">作業 値引額</th>
              <th id="footTechDisc">0</th>
              <th colspan="2">部品 値引額</th>
              <th></th>
              <th></th>
              <th></th>
              <th id="footPartDiscRow">0</th>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>
    <section class="card">
      <h2>合計・値引額</h2>
      <div class="totals">
        <div>
          <h3>技術料</h3>
          <div class="sum-line"><span>合計</span><span id="techSub">0</span></div>
          <div class="disc"><label>値引額</label><input id="techDiscIn" type="number" min="0" step="1" value="0"></div>
          <div class="sum-line strong"><span>差引</span><span id="techTotal">0</span></div>
        </div>
        <div>
          <h3>部品</h3>
          <div class="sum-line"><span>合計（数量×単価）</span><span id="partSub">0</span></div>
          <div class="disc"><label>値引額</label><input id="partDiscIn" type="number" min="0" step="1" value="0"></div>
          <div class="sum-line strong"><span>差引</span><span id="partTotal">0</span></div>
        </div>
      </div>
      <div class="sum-line strong" style="margin-top:12px;"><span>総合計</span><span id="grand">0</span></div>
    </section>
  </main>
  <footer class="bar">
    <div id="status">読み込み中…</div>
    <button type="button" id="btnPrint">印刷用シートを作成</button>
  </footer>

  <script>
    var master = {
      majors: [], allMids: [], midsByMajor: {}, workLines: [],
      partMajors: [], allPartMids: [], partMidsByMajor: {}, partLines: [],
      linesPerPage: 30
    };
    var items = [];

    function $(id) { return document.getElementById(id); }
    function setStatus(msg, isErr) {
      $('status').textContent = msg;
      $('status').className = isErr ? 'err' : '';
    }
    function emptyRow() {
      return {
        major: '', mid: '', fee: '',
        partMajor: '', partMid: '',
        qty: '', unitPrice: '', amount: '', discYen: '',
        kind: ''
      };
    }
    function yen(n) { return Math.round(n || 0).toLocaleString('ja-JP'); }
    function num(v) {
      var n = Number(String(v == null ? '' : v).replace(/,/g, ''));
      return isFinite(n) ? n : 0;
    }
    function filled(v) { return v !== '' && v != null; }
    function listPrice(it) { return num(it.qty) * num(it.unitPrice); }

    function syncLineTotals(it) {
      var list = listPrice(it);
      if (!filled(it.qty) && !filled(it.unitPrice)) {
        it.amount = '';
        return;
      }
      it.amount = Math.round(list);
      if (num(it.discYen) > it.amount) it.discYen = it.amount;
    }

    function midsFor(major) {
      if (!major) return master.allMids || [];
      return (master.midsByMajor && master.midsByMajor[major]) || [];
    }
    function partMidsFor(major) {
      if (!major) return master.allPartMids || [];
      return (master.partMidsByMajor && master.partMidsByMajor[major]) || master.allPartMids || [];
    }
    function linesForMid(major, mid) {
      return (master.workLines || []).filter(function (r) {
        if (String(r.mid || '') !== String(mid || '')) return false;
        if (major && r.major !== major) return false;
        return true;
      });
    }
    function linesForPartMid(major, mid) {
      return (master.partLines || []).filter(function (r) {
        if (String(r.mid || '') !== String(mid || '')) return false;
        if (major && r.major !== major) return false;
        return true;
      });
    }

    function fillSelect(sel, values, selected) {
      if (!sel) return;
      var cur = selected == null ? sel.value : selected;
      sel.innerHTML = '';
      var z = document.createElement('option');
      z.value = '';
      z.textContent = '';
      sel.appendChild(z);
      (values || []).forEach(function (v) {
        var o = document.createElement('option');
        o.value = v;
        o.textContent = v;
        sel.appendChild(o);
      });
      if (cur) {
        if (!values || values.indexOf(cur) === -1) {
          var extra = document.createElement('option');
          extra.value = cur;
          extra.textContent = cur;
          sel.appendChild(extra);
        }
        sel.value = cur;
      }
    }

    function refreshRowSelects(i) {
      var tr = $('tbody').rows[i];
      if (!tr) return;
      var it = items[i];
      fillSelect(tr.querySelector('select[data-k="major"]'), master.majors, it.major);
      fillSelect(tr.querySelector('select[data-k="partMajor"]'), master.partMajors, it.partMajor);
      var midInput = tr.querySelector('input[data-k="mid"]');
      if (midInput) {
        midInput.value = it.mid || '';
        midInput.dataset.options = JSON.stringify(midsFor(it.major));
      }
      var partMidInput = tr.querySelector('input[data-k="partMid"]');
      if (partMidInput) {
        partMidInput.value = it.partMid || '';
        partMidInput.dataset.options = JSON.stringify(partMidsFor(it.partMajor));
      }
      tr.querySelector('[data-k="fee"]').value = it.fee == null ? '' : it.fee;
      tr.querySelector('[data-k="qty"]').value = it.qty == null ? '' : it.qty;
      tr.querySelector('[data-k="unitPrice"]').value = it.unitPrice == null ? '' : it.unitPrice;
      tr.querySelector('[data-k="amount"]').value = it.amount == null || it.amount === '' ? '' : it.amount;
      tr.querySelector('[data-k="discYen"]').value = it.discYen == null || it.discYen === '' ? '' : it.discYen;
    }

    function renderGrid() {
      var n = master.linesPerPage || 30;
      while (items.length < n) items.push(emptyRow());
      items = items.slice(0, n);
      var tb = $('tbody');
      tb.innerHTML = '';
      for (var i = 0; i < n; i++) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="no">' + (i + 1) + '</td>' +
          '<td class="major"><select data-i="' + i + '" data-k="major"></select></td>' +
          '<td class="mid"><div class="combo"><input data-i="' + i + '" data-k="mid" autocomplete="off"><div class="combo-list" hidden></div></div></td>' +
          '<td class="num"><input data-i="' + i + '" data-k="fee"></td>' +
          '<td class="part-major"><select data-i="' + i + '" data-k="partMajor"></select></td>' +
          '<td class="part-mid"><div class="combo"><input data-i="' + i + '" data-k="partMid" autocomplete="off"><div class="combo-list" hidden></div></div></td>' +
          '<td class="num"><input data-i="' + i + '" data-k="unitPrice"></td>' +
          '<td class="num"><input data-i="' + i + '" data-k="qty"></td>' +
          '<td class="num"><input data-i="' + i + '" data-k="amount" readonly tabindex="-1"></td>' +
          '<td class="num"><input data-i="' + i + '" data-k="discYen"></td>';
        tb.appendChild(tr);
        refreshRowSelects(i);
      }
      recalc();
    }

    function rowIsEmpty(r) {
      return !r || (!r.major && !r.mid && !filled(r.fee) && !r.partMajor && !r.partMid &&
        !filled(r.qty) && !filled(r.unitPrice) && !filled(r.amount));
    }
    function padItems() {
      var n = master.linesPerPage || 30;
      while (items.length < n) items.push(emptyRow());
      items = items.slice(0, n);
    }
    function compactItems() {
      var kept = [];
      for (var i = 0; i < items.length; i++) {
        if (!rowIsEmpty(items[i])) kept.push(items[i]);
      }
      items = kept;
      padItems();
    }

    function writeBelow(rowIndex, kind, details) {
      var j = rowIndex + 1;
      while (j < items.length && items[j].kind === kind) {
        items.splice(j, 1);
      }
      for (var k = 0; k < details.length; k++) {
        var pos = rowIndex + 1 + k;
        var cur = items[pos];
        if (cur && rowIsEmpty(cur)) {
          items[pos] = details[k];
        } else if (cur && kind === 'part' && cur.kind !== 'part') {
          cur.partMajor = details[k].partMajor;
          cur.partMid = details[k].partMid;
          if (filled(details[k].qty)) cur.qty = details[k].qty;
          if (filled(details[k].unitPrice)) cur.unitPrice = details[k].unitPrice;
          syncLineTotals(cur);
        } else {
          items.splice(pos, 0, details[k]);
        }
      }
      compactItems();
    }
    function firstFilled(rows, key) {
      for (var i = 0; i < rows.length; i++) {
        if (filled(rows[i][key])) return rows[i][key];
      }
      return '';
    }

    function copyWorkPart(target, w) {
      if (w.partMajor) target.partMajor = w.partMajor;
      if (w.partMid) target.partMid = w.partMid;
      if (filled(w.qty)) target.qty = w.qty;
      if (filled(w.unitPrice)) target.unitPrice = w.unitPrice;
      syncLineTotals(target);
    }

    function onMidChosen(rowIndex) {
      var it = items[rowIndex];
      var mid = String(it.mid || '').trim();
      it.mid = mid;
      it.kind = it.kind === 'part' ? it.kind : 'mid';
      if (!mid) {
        it.fee = '';
        compactItems();
        renderGrid();
        return;
      }
      var group = linesForMid(it.major, mid);
      if (!group.length && it.major) group = linesForMid('', mid);
      var works = group.filter(function (r) { return r.content; });
      var blanks = group.filter(function (r) { return !r.content; });

      if (group.length <= 1) {
        var only = group[0];
        it.fee = only ? only.fee : it.fee;
        if (only && !it.major && only.major) it.major = only.major;
        if (only) copyWorkPart(it, only);
        compactItems();
        renderGrid();
        setStatus('中項目「' + mid + '」を入力しました');
        return;
      }

      it.fee = firstFilled(blanks, 'fee');
      if (blanks[0]) copyWorkPart(it, blanks[0]);
      var details = works.map(function (w) {
        var row = emptyRow();
        row.major = it.major || w.major || '';
        row.mid = w.content;
        row.fee = w.fee;
        row.kind = 'work';
        copyWorkPart(row, w);
        return row;
      });
      writeBelow(rowIndex, 'work', details);
      renderGrid();
      setStatus('中項目「' + mid + '」の明細 ' + works.length + ' 件を下行へ詰めました');
    }

    function onPartMidChosen(rowIndex) {
      var it = items[rowIndex];
      var mid = String(it.partMid || '').trim();
      it.partMid = mid;
      if (!mid) {
        compactItems();
        renderGrid();
        return;
      }
      var group = linesForPartMid(it.partMajor, mid);
      if (!group.length && it.partMajor) group = linesForPartMid('', mid);
      var works = group.filter(function (r) { return r.content; });
      var blanks = group.filter(function (r) { return !r.content; });

      if (group.length <= 1 || works.length === 0) {
        var only = group[0];
        if (only && !it.partMajor && only.major) it.partMajor = only.major;
        if (only) {
          if (filled(only.qty)) it.qty = only.qty;
          if (filled(only.unitPrice)) it.unitPrice = only.unitPrice;
          it.discYen = '';
          syncLineTotals(it);
        }
        compactItems();
        renderGrid();
        setStatus('部品中項目「' + mid + '」を入力しました');
        return;
      }

      var parent = blanks[0];
      if (parent) {
        if (!it.partMajor && parent.major) it.partMajor = parent.major;
        if (filled(parent.qty)) it.qty = parent.qty;
        if (filled(parent.unitPrice)) it.unitPrice = parent.unitPrice;
        syncLineTotals(it);
      }
      var details = works.map(function (w) {
        var row = emptyRow();
        row.partMajor = it.partMajor || w.major || '';
        row.partMid = w.content;
        row.qty = w.qty;
        row.unitPrice = w.unitPrice;
        row.kind = 'part';
        syncLineTotals(row);
        return row;
      });
      writeBelow(rowIndex, 'part', details);
      renderGrid();
      setStatus('部品中項目「' + mid + '」の明細 ' + works.length + ' 件を下行へ詰めました');
    }

    function hideComboLists() {
      Array.prototype.forEach.call(document.querySelectorAll('.combo-list'), function (el) {
        el.hidden = true;
      });
    }
    function comboOptions(input) {
      try { return JSON.parse(input.dataset.options || '[]'); } catch (e) { return []; }
    }
    function showComboList(input) {
      var list = input.parentNode.querySelector('.combo-list');
      if (!list) return;
      var q = String(input.value || '').toLowerCase();
      var opts = comboOptions(input).filter(function (v) {
        return !q || String(v).toLowerCase().indexOf(q) !== -1;
      });
      list.innerHTML = '';
      opts.forEach(function (v) {
        var d = document.createElement('div');
        d.textContent = v;
        d.dataset.value = v;
        list.appendChild(d);
      });
      list.hidden = opts.length === 0;
    }
    function commitCombo(input) {
      var i = Number(input.dataset.i);
      var k = input.dataset.k;
      var v = input.value;
      if (k === 'mid') {
        if (items[i].mid === v) return;
        items[i].mid = v;
        onMidChosen(i);
      } else if (k === 'partMid') {
        if (items[i].partMid === v) return;
        items[i].partMid = v;
        onPartMidChosen(i);
      }
    }

    $('tbody').addEventListener('mousedown', function (e) {
      var opt = e.target.closest('.combo-list div');
      if (!opt) return;
      e.preventDefault();
      var input = opt.parentNode.parentNode.querySelector('input');
      input.value = opt.dataset.value;
      hideComboLists();
      var i = Number(input.dataset.i);
      if (input.dataset.k === 'mid') {
        items[i].mid = opt.dataset.value;
        onMidChosen(i);
      } else {
        items[i].partMid = opt.dataset.value;
        onPartMidChosen(i);
      }
    });
    $('tbody').addEventListener('focusin', function (e) {
      if (e.target.dataset && (e.target.dataset.k === 'mid' || e.target.dataset.k === 'partMid')) {
        hideComboLists();
        showComboList(e.target);
      }
    });
    $('tbody').addEventListener('keydown', function (e) {
      if (!e.target.dataset) return;
      if ((e.target.dataset.k === 'mid' || e.target.dataset.k === 'partMid') && e.key === 'Enter') {
        e.preventDefault();
        hideComboLists();
        commitCombo(e.target);
      }
    });
    $('tbody').addEventListener('focusout', function (e) {
      if (!e.target.dataset) return;
      if (e.target.dataset.k !== 'mid' && e.target.dataset.k !== 'partMid') return;
      var input = e.target;
      setTimeout(function () {
        hideComboLists();
        if (!items[Number(input.dataset.i)]) return;
        commitCombo(input);
      }, 120);
    });
    $('tbody').addEventListener('change', function (e) {
      var t = e.target;
      if (!t.dataset || t.dataset.i == null) return;
      var i = Number(t.dataset.i);
      var k = t.dataset.k;
      if (k === 'mid' || k === 'partMid') return;
      items[i][k] = t.value;
      if (k === 'major') {
        items[i].mid = '';
        refreshRowSelects(i);
      } else if (k === 'partMajor') {
        items[i].partMid = '';
        refreshRowSelects(i);
      } else if (k === 'discYen') {
        items[i].discYen = t.value;
        recalc();
      } else {
        recalc();
      }
    });
    $('tbody').addEventListener('input', function (e) {
      var t = e.target;
      if (!t.dataset || t.tagName !== 'INPUT') return;
      var i = Number(t.dataset.i);
      var k = t.dataset.k;
      if (k === 'mid' || k === 'partMid') {
        showComboList(t);
        return;
      }
      items[i][k] = t.value;
      if (k === 'qty' || k === 'unitPrice') {
        syncLineTotals(items[i]);
        var tr = t.parentNode.parentNode;
        tr.querySelector('[data-k="amount"]').value = items[i].amount === '' ? '' : items[i].amount;
      } else if (k === 'discYen') {
        var list = listPrice(items[i]);
        if (num(items[i].discYen) > list) {
          items[i].discYen = list;
          t.value = list || '';
        }
      }
      recalc();
    });

    ['techDiscIn', 'partDiscIn'].forEach(function (id) {
      $(id).addEventListener('input', recalc);
    });

    function recalc() {
      var techSum = 0;
      var partList = 0;
      var partLineDisc = 0;
      items.forEach(function (it) {
        techSum += num(it.fee);
        var list = listPrice(it);
        partList += list;
        partLineDisc += num(it.discYen);
      });
      var techDisc = Math.max(0, num($('techDiscIn').value));
      if (techDisc > techSum) techDisc = techSum;
      var techNet = Math.max(0, techSum - techDisc);

      var partExtra = Math.max(0, num($('partDiscIn').value));
      var partDisc = partLineDisc + partExtra;
      if (partDisc > partList) partDisc = partList;
      var partNet = Math.max(0, partList - partDisc);

      $('techSub').textContent = yen(techSum);
      $('techTotal').textContent = yen(techNet);
      $('partSub').textContent = yen(partList);
      $('partTotal').textContent = yen(partNet);
      $('grand').textContent = yen(techNet + partNet);
      $('footTech').textContent = yen(techSum);
      $('footTechDisc').textContent = yen(techDisc);
      $('footPartAmt').textContent = yen(partList);
      $('footPartDisc').textContent = yen(partDisc);
      $('footPartDiscRow').textContent = yen(partDisc);
      return {
        techSub: techSum,
        techDisc: techDisc,
        techTotal: techNet,
        partSub: partList,
        partDisc: partDisc,
        partTotal: partNet,
        grand: techNet + partNet
      };
    }

    $('btnPrint').addEventListener('click', function () {
      var summary = recalc();
      var payload = {
        header: {
          kNo: $('kNo').value,
          plate: $('plate').value,
          staff: $('staff').value,
          inDate: $('inDate').value,
          doneDate: $('doneDate').value,
          billDate: $('billDate').value
        },
        items: items,
        summary: summary
      };
      $('btnPrint').disabled = true;
      setStatus('印刷用シートを作成しています…');
      google.script.run
        .withSuccessHandler(function (res) {
          $('btnPrint').disabled = false;
          setStatus('完了: ' + res.sheetNames.join('、') + '（入力 ' + res.lineCount + ' 行 / ' + res.pageCount + ' 枚）');
        })
        .withFailureHandler(function (err) {
          $('btnPrint').disabled = false;
          setStatus(err.message || String(err), true);
        })
        .publishInvoices(payload);
    });

    google.script.run
      .withSuccessHandler(function (data) {
        master = data || master;
        renderGrid();
        setStatus('明細は上から詰めて表示します。合計は数量×単価です。');
      })
      .withFailureHandler(function (err) {
        setStatus(err.message || String(err), true);
      })
      .getInvoiceMaster();
  </script>
</body>
</html>
